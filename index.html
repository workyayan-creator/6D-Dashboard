<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Energi Foodhub</title>
<meta name="description" content="Model 3D ARS Bldg Foodhub dari IFC dengan simulasi energi, suhu ruang, pencahayaan alami, sirkulasi udara, dan kebisingan.">
<meta name="theme-color" content="#0f7d6b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230f7d6b%22/%3E%3Ccircle cx=%2222%22 cy=%2210%22 r=%224%22 fill=%22%23ffd36b%22/%3E%3Cpath d=%22M6 26V14l8-4v16zM14 26V12h10v14z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div class="brand">ARS Bldg Foodhub<small>Simulasi bangunan · IFC2X3</small></div>
      <div class="clock"><b id="clk">12:00</b><span id="sunInfo">matahari</span></div>
    </div>
    <div class="topr">
      <div class="pill" role="group" aria-label="Analisis" id="tabs">
        <button data-a="model" aria-pressed="true">3D</button>
        <button data-a="energi" aria-pressed="false">Energi</button>
        <button data-a="suhu" aria-pressed="false">Suhu</button>
        <button data-a="cahaya" aria-pressed="false">Cahaya</button>
        <button data-a="udara" aria-pressed="false">Udara</button>
        <button data-a="suara" aria-pressed="false">Suara</button>
      </div>
      <div class="pill sm" role="group" aria-label="Pilihan tampilan" id="subs"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="tl">
      <button id="play" aria-label="Putar atau jeda"><svg width="14" height="14" viewBox="0 0 14 14" id="playIco"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
      <input type="range" id="hour" min="0" max="24" step="0.01" value="6" aria-label="Jam">
      <select class="spd" id="spd" aria-label="Kecepatan"><option value="0.5">0.5 j/dtk</option><option value="1" selected>1 j/dtk</option><option value="2">2 j/dtk</option><option value="4">4 j/dtk</option></select>
    </div>
  </div>

  <aside>
    <div class="ahead"><h1 id="aTitle">Energi</h1><p id="aSub"></p></div>
    <section id="secCtrl">
      <div class="lbl">Skenario</div>
      <div class="ctrls" id="ctrls"></div>
    </section>
    <section id="secKpi">
      <div class="lbl" id="kpiLbl">Ringkasan</div>
      <div class="kpis" id="kpis"></div>
    </section>
    <section id="secChart">
      <h2 id="chTitle"></h2>
      <canvas class="chart" id="ch1" aria-label="Grafik"></canvas>
      <div class="now" id="nowLine"></div>
    </section>
    <section id="secStack">
      <h2 id="stTitle"></h2>
      <div class="stack" id="stack"></div>
      <div class="keys" id="keys"></div>
    </section>
    <section>
      <h2 id="zlTitle">Zona (IfcSpace)</h2>
      <div class="zl" id="zl"></div>
      <div class="detail" id="detail" hidden></div>
    </section>
    <section class="note" id="notes"></section>
  </aside>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
